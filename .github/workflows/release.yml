# Build the mod and publish a GitHub Release (with the jar attached) whenever a tag is pushed.
name: release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: setup jdk 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v5

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      - name: stage release jar
        run: |
          mkdir -p release
          find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -exec cp {} release/ \;

      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/*.jar \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Automated build for tag ${GITHUB_REF_NAME}."
